<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForgeCode Gateway</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>🔐 ForgeCode Gateway</h1>

        <!-- Authentication Section -->
        <div class="auth-section" id="authSection">
            <h2>Authentication</h2>
            <div class="status" id="authStatus">
                Please generate a token to access the gateway.
            </div>
            <button class="button" onclick="generateToken()">Generate New Token</button>
            <div id="tokenInfo" class="hidden">
                <p><strong>Your Token:</strong> <span id="tokenValue"></span></p>
                <p><strong>Expires:</strong> <span id="tokenExpiry"></span></p>
                <button class="button" onclick="validateToken()">Validate Token</button>
                <button class="button" onclick="renewToken()">Renew Token</button>
                <button class="button" onclick="connectGateway()">Connect to Gateway</button>
            </div>
        </div>

        <!-- Gateway Section -->
        <div class="gateway-section hidden" id="gatewaySection">
            <h2>Gateway Terminal</h2>
            <div class="status" id="gatewayStatus">
                Ready to execute commands.
            </div>
            <div class="terminal" id="terminal"></div>
            <div>
                <input type="text" id="command" placeholder="Enter command...">
                <button class="button" onclick="sendCommand()">Execute</button>
            </div>
        </div>
    </div>

    <script>
        let currentToken = null;
        let ws = null;

        // Generate new token
        async function generateToken() {
            try {
                const response = await fetch('/auth/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (result.success) {
                    currentToken = result.token;
                    document.getElementById('tokenValue').textContent = result.token;
                    document.getElementById('tokenExpiry').textContent = result.expires_at;
                    document.getElementById('tokenInfo').classList.remove('hidden');
                    document.getElementById('authStatus').textContent = 'Token generated successfully!';
                    document.getElementById('authStatus').className = 'status';
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                document.getElementById('authStatus').textContent = 'Error generating token: ' + error.message;
                document.getElementById('authStatus').className = 'status error';
            }
        }

        // Validate token
        async function validateToken() {
            if (!currentToken) return;

            try {
                const response = await fetch('/auth/validate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token: currentToken })
                });

                const result = await response.json();

                if (result.valid) {
                    document.getElementById('authStatus').textContent = 'Token is valid!';
                    document.getElementById('authStatus').className = 'status';
                } else {
                    document.getElementById('authStatus').textContent = 'Token is invalid: ' + result.message;
                    document.getElementById('authStatus').className = 'status error';
                }
            } catch (error) {
                document.getElementById('authStatus').textContent = 'Error validating token: ' + error.message;
                document.getElementById('authStatus').className = 'status error';
            }
        }

        // Renew token
        async function renewToken() {
            if (!currentToken) return;

            try {
                const response = await fetch('/auth/renew', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token: currentToken })
                });

                const result = await response.json();

                if (result.success) {
                    currentToken = result.new_token;
                    document.getElementById('tokenValue').textContent = result.new_token;
                    document.getElementById('authStatus').textContent = 'Token renewed successfully!';
                    document.getElementById('authStatus').className = 'status';
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                document.getElementById('authStatus').textContent = 'Error renewing token: ' + error.message;
                document.getElementById('authStatus').className = 'status error';
            }
        }

        // Connect to gateway
        function connectGateway() {
            if (!currentToken) return;

            // Show gateway section
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('gatewaySection').classList.remove('hidden');

            // Connect WebSocket
            ws = new WebSocket(`ws://${window.location.host}/ws?token=${currentToken}`);

            ws.onopen = function() {
                document.getElementById('gatewayStatus').textContent = 'WebSocket connected. Terminal ready.';
                document.getElementById('gatewayStatus').className = 'status';
            };

            ws.onmessage = function(event) {
                const terminal = document.getElementById('terminal');
                terminal.innerHTML += event.data + '\n';
                terminal.scrollTop = terminal.scrollHeight;
            };

            ws.onerror = function(error) {
                document.getElementById('gatewayStatus').textContent = 'WebSocket error: ' + error;
                document.getElementById('gatewayStatus').className = 'status error';
            };

            ws.onclose = function() {
                document.getElementById('gatewayStatus').textContent = 'WebSocket disconnected.';
                document.getElementById('gatewayStatus').className = 'status error';
            };
        }

        // Send command to gateway
        function sendCommand() {
            const commandInput = document.getElementById('command');
            const command = commandInput.value.trim();

            if (command && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(command);
                commandInput.value = '';
            }
        }

        // Handle Enter key in command input
        document.getElementById('command').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendCommand();
            }
        });

        // Check if token exists in URL (for direct access)
        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get('token');

        if (urlToken) {
            currentToken = urlToken;
            document.getElementById('tokenValue').textContent = urlToken;
            document.getElementById('tokenInfo').classList.remove('hidden');
            document.getElementById('authStatus').textContent = 'Token loaded from URL. Click "Connect to Gateway" to proceed.';
            document.getElementById('authStatus').className = 'status';
        }
    </script>
</body>
</html>
