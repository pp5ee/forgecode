version: '3.8'

services:
  forge-gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - FORGE_CONFIG_PATH=/data/config.toml
    volumes:
      - forge-data:/data
      - ./config.toml:/data/config.toml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  forge-data:
    driver: local