# Docker Compose configuration for ForgeCode Gateway
version: '3.8'

services:
  forgecode-gateway:
    build: .
    container_name: forgecode-gateway
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - FORGE_GATEWAY_PORT=8080
      - FORGE_GATEWAY_BIND=0.0.0.0
      - FORGE_GATEWAY_WORKERS=4
    volumes:
      - ./data:/app/data:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: forgecode-network