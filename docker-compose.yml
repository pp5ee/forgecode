version: '3.8'

services:
  forge-gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - GATEWAY_PORT=8080
      - FORGECODE_BASE_URL=http://forgecode:8081
    volumes:
      - ./static:/app/static:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - forge-network
    depends_on:
      - forgecode

  forgecode:
    image: forgecode:latest
    ports:
      - "8081:8081"
    environment:
      - RUST_LOG=info
    networks:
      - forge-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for session storage and rate limiting
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - forge-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  redis_data:

networks:
  forge-network:
    driver: bridge