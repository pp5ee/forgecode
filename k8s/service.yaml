apiVersion: v1
kind: Service
metadata:
  name: forgecode-gateway
  namespace: forgecode
  labels:
    app: forgecode-gateway
    component: gateway
spec:
  selector:
    app: forgecode-gateway
  ports:
  - port: 8080
    targetPort: http
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: forgecode
  labels:
    app: redis
    component: cache
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: redis
    protocol: TCP
    name: redis
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgecode-gateway
  namespace: forgecode
  labels:
    app: forgecode-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgecode-gateway
  namespace: forgecode
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgecode-gateway
  namespace: forgecode
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgecode-gateway
subjects:
- kind: ServiceAccount
  name: forgecode-gateway
  namespace: forgecode