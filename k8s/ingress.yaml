apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgecode-gateway
  namespace: forgecode
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - gateway.forgecode.example.com
    secretName: forgecode-gateway-tls
  rules:
  - host: gateway.forgecode.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: forgecode-gateway
            port:
              number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgecode-gateway-metrics
  namespace: forgecode
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"
spec:
  tls:
  - hosts:
    - metrics.forgecode.example.com
    secretName: forgecode-gateway-metrics-tls
  rules:
  - host: metrics.forgecode.example.com
    http:
      paths:
      - path: /metrics(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: forgecode-gateway
            port:
              number: 8080