[package]
name = "forge_gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix = "0.13"
actix-cors = "0.7"
actix-files = "0.6"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json"] }
env_logger = "0.10"
log = "0.4"