<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForgeCode Gateway</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .container {
            display: grid;
            grid-template-columns: 300px 1fr;
            grid-template-rows: 60px 1fr;
            height: 100vh;
            gap: 1px;
            background: #333;
        }

        .header {
            grid-column: 1 / -1;
            background: #2d2d2d;
            border-bottom: 1px solid #444;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d4aa;
        }

        .status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status.connected { background: #10b981; color: white; }
        .status.disconnected { background: #ef4444; color: white; }

        .sidebar {
            background: #252525;
            border-right: 1px solid #444;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tab-buttons {
            display: flex;
            border-bottom: 1px solid #444;
        }

        .tab-button {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-button.active {
            background: #333;
            color: #00d4aa;
            border-bottom: 2px solid #00d4aa;
        }

        .tab-button:hover {
            background: #2d2d2d;
        }

        .tab-content {
            flex: 1;
            overflow: auto;
            padding: 0;
        }

        .file-tree {
            padding: 10px;
        }

        .file-item {
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            margin: 2px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-item:hover {
            background: #333;
        }

        .file-item.active {
            background: #00d4aa20;
            color: #00d4aa;
        }

        .file-icon {
            width: 16px;
            text-align: center;
        }

        .main-content {
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid #444;
        }

        .editor-tabs {
            display: flex;
            background: #252525;
            border-bottom: 1px solid #444;
        }

        .editor-tab {
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            border-right: 1px solid #444;
        }

        .editor-tab.active {
            background: #1a1a1a;
            color: #00d4aa;
        }

        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .editor {
            flex: 1;
            background: #1a1a1a;
            color: #e0e0e0;
            border: none;
            padding: 20px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        .conversation-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            max-width: 80%;
        }

        .message.user {
            background: #00d4aa20;
            margin-left: auto;
            border: 1px solid #00d4aa40;
        }

        .message.assistant {
            background: #333;
            margin-right: auto;
            border: 1px solid #444;
        }

        .message.system {
            background: #555;
            margin: 10px auto;
            text-align: center;
            font-size: 0.9rem;
            max-width: 60%;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #444;
            background: #252525;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            background: #333;
            border: 1px solid #444;
            border-radius: 6px;
            color: #e0e0e0;
            font-family: inherit;
        }

        .message-input:focus {
            outline: none;
            border-color: #00d4aa;
        }

        .send-button {
            padding: 12px 24px;
            background: #00d4aa;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        .send-button:hover {
            background: #00c299;
        }

        .send-button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .terminal-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            color: #00ff00;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 14px;
        }

        .terminal-output {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .terminal-input {
            padding: 12px 20px;
            background: transparent;
            border: none;
            border-top: 1px solid #333;
            color: #00ff00;
            font-family: inherit;
            font-size: inherit;
        }

        .terminal-input:focus {
            outline: none;
        }

        .command-prompt {
            color: #00ff00;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .error {
            color: #ff6b6b;
            background: #ff6b6b20;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }

        .success {
            color: #10b981;
            background: #10b98120;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">ForgeCode Gateway</div>
            <div class="status disconnected" id="status">Disconnected</div>
            <div style="flex: 1"></div>
            <button class="send-button" onclick="manageTokens()">Manage Tokens</button>
        </div>

        <div class="sidebar">
            <div class="tab-buttons">
                <button class="tab-button active" data-tab="files">Files</button>
                <button class="tab-button" data-tab="conversation">Chat</button>
                <button class="tab-button" data-tab="terminal">Terminal</button>
            </div>
            <div class="tab-content">
                <div class="file-tree" id="file-tree">
                    <div style="padding: 20px; text-align: center; color: #666;">
                        Loading file tree...
                    </div>
                </div>
                <div class="conversation-container hidden" id="conversation-sidebar">
                    <!-- Conversation history will go here -->
                </div>
                <div class="terminal-container hidden" id="terminal-sidebar">
                    <!-- Terminal session info will go here -->
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="editor-container" id="editor-view">
                <div class="editor-tabs">
                    <button class="editor-tab active" data-file="">No file selected</button>
                </div>
                <div class="editor-area">
                    <textarea class="editor" id="editor" placeholder="Select a file to edit..."></textarea>
                    <div class="input-area">
                        <div class="input-row">
                            <button class="send-button" onclick="saveFile()">Save File</button>
                            <div style="flex: 1"></div>
                            <button class="send-button" onclick="reloadFiles()">Reload Files</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="conversation-container hidden" id="conversation-view">
                <div class="messages" id="messages">
                    <div class="message system">
                        Welcome to ForgeCode Gateway. Start a conversation with the AI assistant.
                    </div>
                </div>
                <div class="input-area">
                    <div class="input-row">
                        <input type="text" class="message-input" id="message-input" placeholder="Type your message..." onkeypress="handleMessageKeypress(event)">
                        <button class="send-button" id="send-button" onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>

            <div class="terminal-container hidden" id="terminal-view">
                <div class="terminal-output" id="terminal-output">
                    <div class="command-prompt">$ Welcome to ForgeCode Terminal</div>
                    <div class="command-prompt">$ Type commands below to execute them in the workspace</div>
                </div>
                <div class="input-area">
                    <div class="input-row">
                        <input type="text" class="terminal-input" id="terminal-input" placeholder="Type a command..." onkeypress="handleTerminalKeypress(event)">
                        <button class="send-button" onclick="executeCommand()">Execute</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Token Management Modal -->
    <div id="token-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #252525; padding: 30px; border-radius: 8px; width: 500px; max-width: 90vw;">
            <h3 style="margin-bottom: 20px;">Token Management</h3>
            <div id="token-list"></div>
            <div style="margin-top: 20px;">
                <button class="send-button" onclick="createToken()">Create New Token</button>
                <button style="margin-left: 10px; background: #666;" onclick="closeTokenModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
